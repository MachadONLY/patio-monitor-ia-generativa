name: Regenerate verified vision media
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-vision-media.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vision dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r services/vision/requirements.txt
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Build recorded evidence from licensed source
        run: |
          python -m services.vision prepare --data .cache/patio-vision
          python -m services.vision infer --data .cache/patio-vision
      - name: Verify media and source hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('services/vision/artifacts')
          report = json.loads((root / 'report.json').read_text(encoding='utf-8'))
          movie = root / 'annotated.mp4'
          assert movie.is_file() and movie.stat().st_size > 20000
          digest = hashlib.sha256(movie.read_bytes()).hexdigest()
          assert digest == report['video']['sha256']
          assert report['data_origin'] == 'PUBLIC_VIDEO'
          assert report['events'], 'No crossing events detected'
          for event in report['events']:
              image = root / (event['id'] + '.jpg')
              assert image.is_file() and image.stat().st_size > 1000
              assert image.read_bytes()[:3] == b'\xff\xd8\xff'
          print('Media verified:', movie.stat().st_size, 'bytes,', len(report['events']), 'crossing(s)')
          PY
      - name: Publish reproducible recording to repository
        run: |
          git config user.name "Gabriel Teixeira Machado"
          git config user.email "rm551570@fiap.com.br"
          git add services/vision/artifacts/annotated.mp4 services/vision/artifacts/report.json services/vision/artifacts/crossing-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "vision: package verified recorded detector output"
            git push origin HEAD:main
          fi
