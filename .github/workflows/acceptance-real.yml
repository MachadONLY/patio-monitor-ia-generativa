name: Independent acceptance - live feed and local Qwen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/acceptance-real.yml]
permissions:
  contents: read
jobs:
  public-gps:
    name: Real public GPS feed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - name: Query MOBI-Rio rather than a fixture
        working-directory: services/api
        env:
          PATIO_PROBE_RIO: '1'
        run: python -m pytest -q tests/test_rio_provider.py
  qwen-real:
    name: Local Qwen with real generation and sources
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production API and model runtime
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r services/api/requirements-ai.txt
      - name: Download verified official Qwen GGUF
        run: python gs/genai/download_model.py /tmp/qwen.gguf
      - name: Exercise the actual FastAPI route with real Qwen inference
        env:
          PYTHONPATH: services/api
          PATIO_LLM_MODEL_PATH: /tmp/qwen.gguf
          PATIO_LLM_THREADS: '2'
        run: |
          python - <<'PY'
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          from app.assistant import router
          app = FastAPI()
          app.include_router(router)
          client = TestClient(app)
          response = client.post('/api/gs/explain', json={
            'question': 'Que evidências devo verificar e qual é o próximo passo para revisar esta ocorrência?',
            'context': {'tripId':'PM-0615','status':'divergent','reason':'vehicle_swap','evidenceMode':'DEMO'},
          })
          assert response.status_code == 200, response.text
          result = response.json()
          assert result['refused'] is False, result
          assert result['citations'] and result['citations'][0]['id'] == 'p02', result
          assert result['answer'].strip(), result
          print('Qwen answered with source:', result['citations'][0]['id'])
          unknown = client.post('/api/gs/explain', json={'question': 'Qual é a senha do motorista?'})
          assert unknown.status_code == 200, unknown.text
          result = unknown.json()
          assert result['refused'] is True and not result['citations'], result
          print('Unsupported request correctly refused')
          PY
