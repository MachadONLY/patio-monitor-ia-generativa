name: Release acceptance - real browser and local Qwen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-real-e2e.yml
      - apps/web/tests/release-real-e2e.spec.ts
permissions:
  contents: write
jobs:
  professor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PATIO_E2E_REAL: '1'
      PATIO_LIVE_PROVIDER: rio_brt
      PATIO_LLM_MODEL_PATH: ${{ github.workspace }}/runtime-data/qwen.gguf
      PATIO_LLM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          python -m pip install -r services/api/requirements-dev.txt
          python -m pip install --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r services/api/requirements-ai.txt
      - run: python gs/genai/download_model.py runtime-data/qwen.gguf
      - run: pnpm --filter @patio/web exec playwright install --with-deps chromium
      - name: Test exact teacher workflow with no mocked providers or LLM
        run: pnpm --filter @patio/web exec playwright test tests/release-real-e2e.spec.ts --project=application
      - name: Save exact real Qwen and video playback screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          for source_name, dest in (
              ('release-real-qwen-in-3d.png', 'docs/gs/genai/prova-qwen-real.png'),
              ('release-real-vision-tour.png', 'docs/gs/cv/prova-video-tour.png'),
          ):
              files = list(Path('apps/web/test-results').rglob(source_name))
              assert len(files) == 1, (source_name, files)
              target = Path(dest)
              target.parent.mkdir(parents=True, exist_ok=True)
              copyfile(files[0], target)
              assert target.stat().st_size > 10_000
              print('QA screenshot:', target)
          PY
          git config user.name "Gabriel Teixeira Machado"
          git config user.email "rm551570@fiap.com.br"
          git add docs/gs/genai/prova-qwen-real.png docs/gs/cv/prova-video-tour.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: preserve tested real Qwen and video playback evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professor-real-e2e
          path: apps/web/test-results/
          retention-days: 3
